services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: contract-review-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=contract_review
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract-review-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/contract_review
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=false
      - CORS_ORIGINS=["http://124.220.42.5:5173","http://124.220.42.5"]
      - OPENAI_API_KEY=sk-575b711370604fb7959d7ed4eaf2561a
      - OPENAI_BASE_URL=https://api.deepseek.com
      - LLM_MODEL=deepseek-v4-pro
    volumes:
      - uploads_data:/app/uploads
      - ./contract_templates:/app/contract_templates:ro

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contract-review-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads_data:
